rag_simulate:
  system: |
    你是一个专业的面试题库管理员。你需要根据公司名称和岗位名称，模拟历史题库中的类似题目。
    生成的题目应该符合真实招聘场景，包含多个难度级别和提问环节。
  user: |
    请为以下公司和岗位生成 {count} 道历史参考面试题目。

    公司: {company}
    岗位: {position}

    返回一个 JSON 数组，每个题目包含以下字段：
    - text (str): 题目文本
    - phase (str): 提问环节，可选值为: 简历提问, 技术能力提问, 项目经验提问, 行为/软技能提问
    - difficulty (str): 难度级别，可选值为: 初级, 中级, 高级
    - tags (dict): 标签，包含 company, position, question_phase, difficulty

    只返回 JSON 数组，不要有其他内容。

generate_questions:
  system: |
    你是一个专业的面试题目设计师。你需要根据岗位要求、面试官风格和参考题目，生成定制化的面试题。
    生成的题目应该能够全面评估候选人的能力，包括技术能力、项目经验、行为表现等多个维度。
  user: |
    请根据以下信息生成 20 道定制化面试题目。

    岗位信息：
    公司: {company}
    岗位: {position}

    岗位描述 (JD):
    {jd}

    面试官风格:
    {personality}

    历史参考题目 (RAG):
    {rag_questions}

    行业参考题目 (WebSearch):
    {web_questions}

    生成规则：
    1. 生成恰好 20 道题目，按以下分布：
       - 简历提问: 5 道
       - 技术能力提问: 8 道
       - 项目经验提问: 4 道
       - 行为/软技能提问: 3 道

    2. 难度分布应合理，不要全是高难度题。

    3. 题目应该深度结合 JD 内容，问出该岗位的核心能力要求。

    4. 参考历史题目和行业题目的风格，但要生成新的、定制化的题目。

    返回一个 JSON 数组，每个题目包含以下字段：
    - id (int): 题目编号，从 1 到 20
    - text (str): 题目文本
    - phase (str): 提问环节，可选值为: 简历提问, 技术能力提问, 项目经验提问, 行为/软技能提问
    - difficulty (str): 难度级别，可选值为: 初级, 中级, 高级
    - tags (dict): 标签，包含 company, position, question_phase, difficulty

    只返回 JSON 数组，不要有其他内容。

web_search_questions:
  system: |
    你是一个专业的面试题库研究员。根据岗位信息，使用网络搜索功能找到真实的面试题目。
    你需要搜索并整理该岗位的常见面试题。
  user: |
    请为以下岗位搜索并列举常见的面试题目。

    公司: {company}
    岗位: {position}

    岗位描述:
    {jd}

    请搜索找到该岗位的实际面试题目，返回最多 {limit} 道题目。
    返回一个 JSON 数组，每个元素包含：
    - text (str): 题目文本

    只返回 JSON 数组，格式如下：
    [{"text": "题目1"}, {"text": "题目2"}, ...]
