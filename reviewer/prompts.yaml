voice_tone:
  system: |
    你是一位专业的面试评估专家，专注于从语音和语调维度评估面试者表现。
  user: |
    请根据以下岗位JD，对面试者在这段视频中的语音和语调表现进行评估。

    【岗位JD】
    {jd}

    评估维度：
    1. 语速与节奏：语速是否适中，表达是否流畅
    2. 语气自信度：语气是否坚定、自信，有无过多犹豫词（"嗯""啊""那个"等）
    3. 情绪感染力：声音是否有感染力，是否能传递热情和专业感
    4. 与岗位匹配度：语言风格是否符合该岗位对沟通能力的要求

    请以JSON格式输出，字段如下：
    {{
      "segment_id": "{segment_id}",
      "time_range": "{time_range}",
      "tone_score": <1-10整数>,
      "tone_summary": "<100字以内的综合评价>",
      "tone_details": {{
        "speech_pace": "<评价>",
        "confidence": "<评价>",
        "expressiveness": "<评价>",
        "jd_match": "<评价>"
      }}
    }}

facial_expression:
  system: |
    你是一位专业的面试评估专家，专注于从面部表情和肢体语言维度评估面试者表现。
  user: |
    请根据以下岗位JD，对面试者在这段视频中的面部表情和肢体语言进行评估。

    【岗位JD】
    {jd}

    评估维度：
    1. 眼神接触：是否保持适当的眼神交流，是否频繁回避
    2. 表情自然度：表情是否自然放松，是否过于紧张或僵硬
    3. 微表情信号：是否有明显的紧张、焦虑或不自信信号
    4. 整体仪态：坐姿、手势等肢体语言是否得体专业

    请以JSON格式输出，字段如下：
    {{
      "segment_id": "{segment_id}",
      "time_range": "{time_range}",
      "facial_score": <1-10整数>,
      "facial_summary": "<100字以内的综合评价>",
      "facial_details": {{
        "eye_contact": "<评价>",
        "expression_naturalness": "<评价>",
        "micro_expressions": "<评价>",
        "posture": "<评价>"
      }}
    }}

final_evaluation:
  system: |
    你是一位资深面试评估专家，负责综合多个片段的语音语调和面部表情评估结果，形成整体非语言维度的面试报告。
  user: |
    以下是面试各阶段的语音语调评估结果和面部表情评估结果，以及本次面试的岗位JD。
    请综合分析，输出整个面试过程中面试者在语音语调与面部表情维度的综合评价。

    【岗位JD】
    {jd}

    【各片段语音语调评估】
    {tone_results}

    【各片段面部表情评估】
    {facial_results}

    请输出以下格式的综合评价：

    ## 非语言维度综合评估

    ### 语音语调总体表现
    - 综合评分：<X/10>
    - 优势：<要点>
    - 待改进：<要点>
    - 各阶段趋势：<是否随面试进行有变化规律>

    ### 面部表情总体表现
    - 综合评分：<X/10>
    - 优势：<要点>
    - 待改进：<要点>
    - 各阶段趋势：<是否随面试进行有变化规律>

    ### 非语言维度关键结论
    <200字以内，重点突出最影响面试结果的非语言因素>

text_content:
  system: |
    你是一位专业的面试评估专家，专注于从语言内容和回答质量维度评估面试者表现。
  user: |
    以下是面试的完整文字记录和岗位JD，请从内容质量维度进行评估。

    【岗位JD】
    {jd}

    【面试完整文字记录】
    {transcript}

    评估维度：
    1. 回答相关性：回答是否切中问题，是否与岗位要求高度相关
    2. 内容深度：是否有具体案例、数据支撑，思维是否有深度
    3. 逻辑结构：回答是否条理清晰，是否有良好的表达框架（如STAR法则）
    4. 岗位匹配度：整体内容是否展现出与岗位匹配的能力和经验

    请输出以下格式的评价：

    ## 内容维度评估

    ### 整体内容评分：<X/10>

    ### 各维度分析
    - **回答相关性**：<评价>
    - **内容深度**：<评价>
    - **逻辑结构**：<评价>
    - **岗位匹配度**：<评价>

    ### 亮点回答
    <列举1-3个表现突出的回答片段>

    ### 薄弱环节
    <列举1-3个需要改进的回答>

    ### 内容维度关键结论
    <150字以内>

final_eval:
  system: |
    你是一位顶级面试评估专家，负责综合面试者在非语言表现（语音语调+面部表情）和内容表现两大维度的评估结果，结合岗位要求和面试官风格，给出最终综合面试评价报告。
  user: |
    请综合以下所有评估结果，生成最终面试评价报告。

    【岗位JD】
    {jd}

    【面试官性格与风格】
    {personality}

    【非语言维度综合评估（语音语调+面部表情）】
    {tone_facial_res}

    【内容维度评估】
    {content_res}

    请生成以下结构的最终评价报告：

    # 面试综合评价报告

    ## 总体评分
    | 维度 | 评分 |
    |------|------|
    | 语音语调 | X/10 |
    | 面部表情 | X/10 |
    | 内容质量 | X/10 |
    | **综合得分** | **X/10** |

    ## 综合评价
    <300字以内，结合面试官风格偏好，给出客观全面的评价>

    ## 核心优势
    1. <优势1>
    2. <优势2>
    3. <优势3>

    ## 主要短板
    1. <短板1>
    2. <短板2>

    ## 面试官视角分析
    <基于面试官性格和风格，分析面试者与该面试官的匹配程度，以及面试官可能的主观印象>

    ## 改进建议
    1. <建议1>
    2. <建议2>
    3. <建议3>

    ## 录用建议
    <强烈推荐 / 推荐 / 谨慎考虑 / 不推荐>：<50字以内的理由>
